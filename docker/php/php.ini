; Production-leaning defaults. Anything a project needs to tune per environment
; belongs in .env, not here.

memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 120

; The image is built once per deploy and the code never changes inside it, so
; revalidation is pure overhead.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

expose_php = Off
