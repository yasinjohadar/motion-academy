# Deployment stack: nginx + php-fpm + mysql + redis, plus the two processes a
# Laravel application silently depends on and that are easy to forget — a queue
# worker and the scheduler.
#
# The queue worker names its queues explicitly. A bare `queue:work` listens only to
# `default`, which would leave broadcast, mail and whatsapp jobs sitting forever
# with nothing reporting an error.

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  restart: unless-stopped
  env_file: .env
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started
  volumes:
    # Only writable state is mounted; application code lives in the image.
    - storage:/var/www/html/storage

services:
  app:
    <<: *app

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8080}:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    <<: *app
    command: php artisan queue:work --queue=broadcast,default,mail,whatsapp --tries=3 --max-time=3600
    # --max-time recycles the worker hourly: long-lived PHP processes hold stale
    # code and leak memory, and a recycled worker picks up a new deploy.

  scheduler:
    <<: *app
    command: php artisan schedule:work

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: '${DB_DATABASE:-laravel}'
      MYSQL_USER: '${DB_USERNAME:-laravel}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:-secret}'
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      # The app waits for this rather than crash-looping until MySQL finishes its
      # first-run initialisation.
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_ROOT_PASSWORD:-secret}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis:/data

volumes:
  mysql:
  redis:
  storage:
